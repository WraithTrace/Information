let active='',query='';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s??'').toLocaleLowerCase('ko').normalize('NFKC');const match=s=>!query||norm(s).includes(norm(query));
function draw(){const items=DATA.items.filter(x=>(!active||x.category===active)&&match([x.title,x.command,x.description,x.group,x.app,x.method,...(x.methods||[]).flatMap(m=>[m.label,...m.commands])].join(' ')));const guides=DATA.guides.filter(x=>(!active||x.category===active)&&match([x.title,x.description,x.group,x.app,...x.steps].join(' ')));$('#total').textContent=DATA.items.length;$('#guideTotal').textContent=DATA.guides.length;$('#heading').textContent=categories.find(x=>x[1]===active)?.[0]||'전체 자료';$('#kicker').textContent=query?`“${query}” 검색 결과`:'INFORMATION';$('#count').textContent=`${items.length+guides.length}개 항목`;
$('#nav').innerHTML=categories.map(([label,value])=>{const n=value?DATA.items.filter(x=>x.category===value).length+DATA.guides.filter(x=>x.category===value).length:DATA.items.length+DATA.guides.length;return `<button class="${active===value?'active':''}" data-cat="${esc(value)}"><span>${esc(label)}</span><small>${n}</small></button>`}).join('');
$('#guides').innerHTML=guides.map(x=>`<details class="guide" ${query?'open':''}><summary>${esc(x.title)}<small>${esc(x.app)} · ${esc(x.group)}</small></summary><div class="guide-body"><p>${esc(x.description)}</p><ol>${x.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${x.risk?`<div class="risk">${esc(x.risk)}</div>`:''}</div></details>`).join('');
$('#cards').innerHTML=items.map(x=>{const methods=x.methods||[{label:x.method||x.app||'명령',commands:[x.command].filter(Boolean)}];return `<article class="card"><span class="tag">${esc(x.group||x.category)}</span><h3>${esc(x.title)}</h3>${x.description?`<p>${esc(x.description)}</p>`:''}${methods.map(m=>m.commands.map(c=>`<div class="method"><div class="method-label">${esc(m.label)}</div><div class="code-row"><code class="code">${esc(c)}</code><button class="copy" data-copy="${esc(c)}">복사</button></div>${DATA.examples?.[c]?`<div class="example"><div class="example-label">실행 결과 예시</div><pre>${esc(DATA.examples[c])}</pre></div>`:''}</div>`).join('')).join('')}${x.risk?`<div class="risk">${esc(x.risk)}</div>`:''}</article>`}).join('');$('#empty').hidden=!!(items.length||guides.length);$('#noData').hidden=!!items.length||!!guides.length||!!query||!active;$('#noData').textContent=active==='Microsoft Excel'?'원본 Microsoft Excel 시트에 등록된 명령이나 단축키가 아직 없습니다.':'이 카테고리에는 아직 등록된 자료가 없습니다.';
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{active=b.dataset.cat;draw()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='복사됨';setTimeout(()=>b.textContent='복사',1000)}catch{b.textContent='복사 실패'}})}
$('#q').oninput=e=>{query=e.target.value.trim();draw()};draw();
