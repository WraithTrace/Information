 inherit;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.nav-item:hover{background:var(--wash)}.nav-item.active{background:var(--blue-soft);color:var(--blue);font-weight:700}.nav-item small{color:#9ba5b3;font-size:10px}.sidebar select{width:100%;padding:10px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#536072;font:inherit}.tip{background:#f7f8fc;padding:14px;border-radius:10px;margin-top:32px}.tip b{font-size:11px}.tip p{font-size:11px;line-height:1.7;color:var(--muted);margin:7px 0 0}.results{min-width:0}.results-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.results-head h2{font-size:21px;letter-spacing:-.6px;margin:6px 0 0}.result-count{color:#8b96a5;font-size:11px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:11px;padding:15px 16px 14px;min-width:0;transition:.15s}.card:hover{border-color:#c6d0fa;box-shadow:var(--shadow);transform:translateY(-1px)}.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:10px;color:#627086;background:#f3f5f8;padding:4px 7px;border-radius:5px}.copy{border:0;background:transparent;color:#8994a3;font-size:11px;cursor:pointer;padding:4px}.copy:hover{color:var(--blue)}.card h3{font-size:14px;margin:11px 0 7px;letter-spacing:-.2px;overflow-wrap:anywhere}.command{display:block;background:#f5f7fa;border:1px solid #edf0f4;border-radius:7px;padding:10px 11px;font:12px/1.55 Consolas,'Courier New',monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#33405a;margin:0 0 9px}.card p{color:#768193;font-size:11px;line-height:1.65;margin:0}.risk{margin-top:10px;padding:9px 10px;border-radius:7px;background:#fff7e8;color:#875410;font-size:10px;line-height:1.6}.guide{border:1px solid #dfe5f5;border-radius:12px;margin:0 0 13px;overflow:hidden}.guide summary{list-style:none;cursor:pointer;padding:16px 17px;display:flex;align-items:center;justify-content:space-between}.guide summary::-webkit-details-marker{display:none}.guide-title{font-weight:700}.guide-meta{display:block;font-size:10px;color:#8994a3;margin-top:5px}.guide-body{padding:0 17px 16px;border-top:1px solid var(--line)}.guide-body p{color:#6f7b8e;font-size:11px;line-height:1.7}.guide-body ol{padding-left:19px;color:#3f4c5e;font-size:12px;line-height:1.9}.guide-risk{color:#855712;background:#fff7e8;padding:10px;border-radius:7px;font-size:10px;line-height:1.6}.guide-area{margin-bottom:14px}.empty{text-align:center;padding:55px 10px;color:var(--muted)}.empty>div{font-size:30px}.empty h3{font-size:14px;color:var(--ink);margin:10px 0 6px}.empty p{font-size:11px}footer{border-top:1px solid var(--line);text-align:center;color:#9aa4b1;font-size:10px;padding:22px;margin-top:45px}
@media(max-width:760px){.topbar{padding:0 18px}.github{font-size:10px}main{padding:0 18px}.hero{padding:45px 0 30px}.hero h1{font-size:37px}.workspace{grid-template-columns:1fr;gap:24px}.sidebar{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}.side-label{grid-column:1/-1;margin-bottom:0}.side-label.app-label{grid-column:1;margin:6px 0 0}.sidebar nav{grid-column:1/-1;grid-template-columns:repeat(2,1fr)}.sidebar select{grid-column:2;grid-row:2}.tip{display:none}.cards{grid-template-columns:1fr}.stats{gap:16px}}

  <main id="top">
    <section class="hero">
      <div class="eyebrow">PERSONAL KNOWLEDGE BASE</div>
      <h1>필요한 명령을<br><span>빠르게 찾아 쓰세요.</span></h1>
      <p>PC 설정부터 프로그램 단축키까지, 한곳에서 검색하고 순서대로 확인합니다.</p>
      <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="명령어, 기능, 설명 검색…" autocomplete="off"><kbd>Enter</kbd></div>
      <div class="stats"><div><strong id="item-count">—</strong><span>검색 항목</span></div><div><strong id="guide-count">—</strong><span>순서별 가이드</span></div><div><strong>3</strong><span>분야</span></div></div>
    </section>
    <section class="workspace">
      <aside class="sidebar">
        <div class="side-label">분야</div><nav id="categories" aria-label="분야 필터"></nav>
        <div class="side-label app-label">프로그램</div><select id="app-filter" aria-label="프로그램 필터"><option value="">모든 프로그램</option></select>
        <div class="tip"><b>사용 팁</b><p>PC 설정은 가이드에서 순서대로, 자주 쓰는 명령은 검색창에서 바로 찾을 수 있어요.</p></div>
      </aside>
      <section class="results" aria-live="polite">
        <div class="results-head"><div><div class="eyebrow" id="section-kicker">전체 보관함</div><h2 id="section-title">모든 항목</h2></div><span id="result-count" class="result-count"></span></div>
        <div id="guide-area"></div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty" hidden><div>⌕</div><h3>검색 결과가 없습니다</h3><p>다른 검색어나 필터를 선택해 보세요.</p></div>
      </section>
    </section>
  </main>
  <footer>개인용 참고 자료 · 실행 전 명령과 대상 PC를 확인하세요.</footer>
  <script>window.INFORMATION_DATA = {"items":[{"category":"PC","app":"CMD","title":"winver","command":"winver","description":"Window 버전 / 빌드","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"wmic path softwarelicensingservice get OA3xOriginalProductKey","command":"wmic path softwarelicensingservice get OA3xOriginalProductKey","description":"CMD Window Key 확인","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"hostname","command":"hostname","description":"컴퓨터 이름","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"whoami","command":"whoami","description":"현재 시스템에 접속해 있는 [컴퓨터이름\\사용자계정] 형태의 전체 프로필을 출력","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"echo %username%","command":"echo %username%","description":"윈도우 시스템 변수 중 현재 사용자 이름을 담고 있는 %username% 값을 화면에 출력","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"systeminfo","command":"systeminfo","description":"상세한 하드웨어 및 운영체제(OS) 시스템 정보","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"msinfo32","command":"msinfo32","description":"시스템 정보 요약. CPU, 메인보드 모델명, 바이오스 버전, 램 용량 등을 한눈에 확인할 때 가장 깔끔합니다.","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"dxdiag","command":"dxdiag","description":"다이렉트X 진단 도구. 그래픽카드 모델명과 VRAM 용량, 드라이버 버전, 모니터 주사율 등을 확인할 때 유용합니다.","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"sysdm.cpl","command":"sysdm.cpl","description":"시스템 속성 창 열기. 컴퓨터 이름 변경, 고급 시스템 설정(가상 메모리, 환경 변수), 정품 인증 상태를 확인할 수 있습니다.","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"devmgmt.msc","command":"devmgmt.msc","description":"장치 관리자. 그래픽, 랜카드, 사운드 등 하드웨어 드라이버 오류나 느낌표 뜬 장치를 확인할 때 씁니다.","group":"시스템 정보 및 하드웨어 사양 확인","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"oobe\\bypassnro","command":"oobe\\bypassnro","description":"윈도우 11 초기 설치 시 인터넷 연결 및 마이크로소프트(MS) 계정 강제 로그인을 우회하고 로컬 계정으로 오프라인 설치를 진행하게 해주는 명령어입니다. (설정 화면에서 Shift + F10을 눌러 명령 프롬프트를 켠 뒤 입력)","group":"윈도우 설치 및 초기 설정","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"netplwiz","command":"netplwiz","description":"사용자 계정 제어. 윈도우 부팅 시마다 마이크로소프트 계정 비밀번호나 PIN 번호를 묻지 않고 자동으로 로그인되도록 설정할 때 사용합니다.","group":"윈도우 설치 및 초기 설정","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"sfc /scannow","command":"sfc /scannow","description":"윈도우 시스템 파일이 손상되었거나 알 수 없는 오류가 발생했을 때, 누락되거나 깨진 시스템 파일을 자동으로 검사하고 복구합니다.","group":"시스템 점검 및 파일 복구","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"DISM.exe /Online /Cleanup-image /Restorehealth","command":"DISM.exe /Online /Cleanup-image /Restorehealth","description":"sfc로도 해결되지 않는 윈도우 이미지 파일(OS 근간)의 손상을 마이크로소프트 서버에서 최신 파일로 다운로드하여 복구해 줍니다. (보통 두 명령어를 세트로 자주 씁니다.)","group":"시스템 점검 및 파일 복구","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"ipconfig /all","command":"ipconfig /all","description":"내 컴퓨터의 IP 주소, 게이트웨이, MAC 주소(랜카드 고유 번호), DNS 서버 주소를 상세히 확인합니다.","group":"네트워크 및 인터넷 관리, cmd 또는 터미널에서 입력","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"ipconfig /flushdns","command":"ipconfig /flushdns","description":"인터넷 접속이 자꾸 끊기거나 특정 사이트가 안 열릴 때, PC에 쌓인 DNS 캐시(인터넷 주소 기록)를 초기화하여 네트워크 문제를 해결합니다.","group":"네트워크 및 인터넷 관리, cmd 또는 터미널에서 입력","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"ping 8.8.8.8 -t","command":"ping 8.8.8.8 -t","description":"구글 서버로 지속적인 신호를 보내어 내 인터넷 회선이 끊김(패킷 손실) 없이 안정적으로 연결되어 있는지 실시간으로 테스트합니다. (끝내려면 Ctrl + C)","group":"네트워크 및 인터넷 관리, cmd 또는 터미널에서 입력","platform":"Windows CMD","risk":""},{"category":"PC","app":"CMD","title":"diskmgmt.msc","command":"diskmgmt.msc","descri function render() {
  const items = catalog.items.filter(x => (activeCategory==='전체'||x.category===activeCategory) && (!activeApp||x.app===activeApp) && matches([x.title,x.command,x.description,x.group,x.app].join(' ')));
  const guides = catalog.guides.filter(x => (activeCategory==='전체'||x.category===activeCategory) && (!activeApp||x.app===activeApp) && matches([x.title,x.description,x.group,x.app,...x.steps].join(' ')));
  $('#item-count').textContent = catalog.items.length;
  $('#guide-count').textContent = catalog.guides.length;
  $('#result-count').textContent = `${items.length + guides.length}개 항목`;
  $('#section-title').textContent = activeCategory==='전체'?'모든 항목':activeCategory;
  $('#section-kicker').textContent = query ? `“${query}” 검색 결과` : 'INFORMATION LIBRARY';
  $('#categories').innerHTML = categoryNames.map(c=>`<button class="nav-item ${c===activeCategory?'active':''}" data-category="${c}"><span>${categoryIcons[c]} &nbsp;${c}</span><small>${c==='전체'?catalog.items.length+catalog.guides.length:catalog.items.filter(x=>x.category===c).length+catalog.guides.filter(x=>x.category===c).length}</small></button>`).join('');
  $('#app-filter').innerHTML = '<option value="">모든 프로그램</option>'+[...new Set([...catalog.items.map(x=>x.app),...catalog.guides.map(x=>x.app)])].sort((a,b)=>a.localeCompare(b,'ko')).map(a=>`<option value="${esc(a)}" ${activeApp===a?'selected':''}>${esc(a)}</option>`).join('');
  $('#guide-area').innerHTML = guides.map((g,i)=>`<details class="guide" ${query?'open':''}><summary><span><span class="guide-title">${esc(g.title)}</span><span class="guide-meta">${esc(g.app)} · ${esc(g.group)}</span></span><span aria-hidden="true">＋</span></summary><div class="guide-body"><p>${esc(g.description)}</p><ol>${g.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${g.risk?`<div class="guide-risk">${esc(g.risk)}</div>`:''}</div></details>`).join('');
  $('#cards').innerHTML = items.map(x=>`<article class="card"><div class="card-top"><span class="tag">${esc(x.app)} · ${esc(x.group)}</span>${x.command?`<button class="copy" data-copy="${esc(x.command)}" aria-label="명령어 복사">복사</button>`:''}</div><h3>${esc(x.title)}</h3>${x.command?`<pre class="command">${esc(x.command)}</pre>`:''}<p>${esc(x.description)}</p>${x.risk?`<div class="risk">${esc(x.risk)}</div>`:''}</article>`).join('');
  $('#empty').hidden = !!(items.length||guides.length);
  $('#cards').hidden = !items.length;
  $('#guide-area').hidden = !guides.length;
  document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{activeCategory=b.dataset.category;render()}));
  document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent='복사됨';setTimeout(()=>b.textContent='복사',1100)}catch{b.textContent='복사 실패'}}));
}
catalog = window.INFORMATION_DATA; render(); $('#search').addEventListener('input',e=>{query=e.target.value.trim();render()}); $('#app-filter').addEventListener('change',e=>{activeApp=e.target.value;render()});

</script>
</body>
</html>
